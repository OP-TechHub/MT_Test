<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Internship & Management Trainee Assessment</title>

  <style>
    :root{
      --headerH: 128px;
      --bg:#0b1220;
      --panel:#0f1a2e;
      --text:#eaf0ff;
      --muted:#a9b6d3;
      --border:rgba(255,255,255,.10);
      --accent:#6ea8ff;
      --accent2:#7c5cff;
      --danger:#ffb020;
      --ok:#34d399;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:16px;
      --radius2:22px;
      --focus: 0 0 0 4px rgba(110,168,255,.25);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      overflow: hidden;
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", Helvetica, sans-serif;
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(124,92,255,.25), transparent 55%),
        radial-gradient(900px 600px at 95% 10%, rgba(110,168,255,.25), transparent 55%),
        linear-gradient(180deg, #070b14 0%, #0b1220 100%);
      color:var(--text);
      line-height:1.5;
    }

    #content{
      height: 100vh;
      overflow: auto;
      padding-top: var(--headerH);
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 22px 16px 60px;
    }

    .topbar{
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      backdrop-filter: blur(10px);
      background: linear-gradient(180deg, rgba(11,18,32,.92) 0%, rgba(11,18,32,.72) 100%);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner{
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 16px 10px;
      display:flex;
      gap:14px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
    }

    .brand{ display:flex; gap:12px; align-items:center; min-width: 250px; }
    .logo{
      width:42px;height:42px;border-radius:14px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      box-shadow: 0 10px 25px rgba(124,92,255,.25);
      display:grid; place-items:center; font-weight:800; color:#081225;
    }
    .title{ display:flex; flex-direction:column; gap:2px; }
    .title strong{ font-size: 14px; letter-spacing:.3px; }
    .subtitle{ color:var(--muted); font-size: 12.5px; }

    .right{ display:flex; flex-direction:column; gap:10px; align-items:flex-end; min-width: 280px; }
    .pill-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .pill{
      display:inline-flex; gap:8px; align-items:center; padding:8px 10px;
      border:1px solid var(--border); border-radius:999px;
      background: rgba(255,255,255,.04); color:var(--muted); font-size:12.5px;
    }
    .timer{ color: var(--text); border-color: rgba(110,168,255,.35); background: rgba(110,168,255,.08); font-weight:700; }
    .dot{ width:8px; height:8px; border-radius:999px; background: var(--accent); box-shadow: 0 0 0 5px rgba(110,168,255,.12); }

    .progress-wrap{ width: 320px; max-width: 100%; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
    .progress-text{ color: var(--muted); font-size: 12.5px; text-align:right; }
    .bar{ width: 100%; height: 10px; border-radius: 999px; border:1px solid var(--border); background: rgba(255,255,255,.04); overflow:hidden; }
    .bar > div{ height:100%; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s ease; }

    .nav{ max-width: 980px; margin: 0 auto; padding: 0 16px 12px; display:flex; gap:10px; flex-wrap:wrap; }
    .nav a{
      text-decoration:none; color: var(--text); font-size: 12.5px; padding: 8px 10px;
      border-radius: 999px; border:1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.03);
    }
    .nav a:hover{ border-color: rgba(110,168,255,.35); background: rgba(110,168,255,.08); }

    .panel{ background: linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.03) 100%); border:1px solid var(--border); border-radius: var(--radius2); box-shadow: var(--shadow); padding: 18px; margin-top: 18px; }
    .grid{ display:grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 800px){ .grid.two{ grid-template-columns: 1.2fr .8fr; } }

    .h3{ font-size: 15px; margin: 0 0 8px; }
    .muted{ color:var(--muted); font-size: 13px; }
    .warn{ color: var(--danger); font-size: 13px; }
    .ok{ color: var(--ok); font-size: 13px; }

    input[type="text"], textarea{ width:100%; padding: 12px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text); outline:none; }
    textarea{ min-height: 110px; resize: vertical; }

    .section{ margin-top: 18px; scroll-margin-top: calc(var(--headerH) + 10px); }
    .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
    .section-title{ font-size: 14px; margin:0; }
    .section-badge{ font-size:12px; color: var(--muted); border:1px solid var(--border); border-radius:999px; padding: 7px 10px; background: rgba(255,255,255,.03); }

    .q{ background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
    .q h4{ margin:0 0 10px; font-size: 14px; }

    .options{ display:grid; gap: 8px; }
    .opt{ display:flex; gap:10px; padding: 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.02); cursor:pointer; }
    .opt:hover{ border-color: rgba(110,168,255,.25); background: rgba(110,168,255,.06); }

    .btn{
      border: 1px solid rgba(110,168,255,.35);
      background: linear-gradient(135deg, rgba(110,168,255,.25) 0%, rgba(124,92,255,.20) 100%);
      color: var(--text); padding: 12px 14px; border-radius: 14px; font-weight: 700; cursor:pointer;
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    @media print{ .topbar, .nav, #submitArea{ display:none; } }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">MT</div>
        <div class="title">
          <strong>INTERNSHIP & MANAGEMENT TRAINEE ASSESSMENT</strong>
          <div class="subtitle">oceanpick (pvt) ltd</div>
        </div>
      </div>
      <div class="right">
        <div class="pill-row">
          <div class="pill timer" id="timer"><span class="dot"></span>Loading timer…</div>
        </div>
        <div class="progress-wrap">
          <div class="progress-text" id="progressText">Progress: 0/81 answered</div>
          <div class="bar"><div id="progressBar"></div></div>
        </div>
      </div>
    </div>
    <div class="nav">
      <a href="#secA">Section A</a> <a href="#secB">Section B</a> <a href="#secC">Section C</a> 
      <a href="#secD">Section D</a> <a href="#secE">Section E</a> <a href="#secF">Section F</a> 
      <a href="#submitArea">Submit</a>
    </div>
  </div>

  <div id="content">
    <div class="wrap">
      <div class="panel">
        <div class="grid two">
          <div>
            <h3 class="h3">Candidate details</h3>
            <input id="name" type="text" placeholder="Enter your full name" required />
            <div style="margin-top:10px" class="muted" id="autosaveStatus"></div>
          </div>
          <div>
            <h3 class="h3">Instructions</h3>
            <div class="muted">• Answer all MCQs<br/>• Writing answers: 4–6 lines</div>
          </div>
        </div>
      </div>

      <div class="panel" id="form"></div>

      <div class="panel" id="submitArea">
        <div class="actions" style="display:flex; justify-content:space-between; align-items:center;">
          <button class="btn" id="submitBtn">Submit Test</button>
          <div id="status" class="small"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/** 1. CONFIGURATION **/
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvuPRwoP2AM2T-7ubO-3ss2WQFUX9WCpqDX-u6be2wwZe7gq1Z6u8z2z-slJVfWcwj/exec";
const DURATION_MS = 90 * 60 * 1000;
const STORAGE_KEY = "intern_test_v1";

/** 2. STATE **/
let submitted = false;
let timeUp = false;
let autosaveInterval = null;
let timerInterval = null;
const startedAt = (function(){
  const saved = localStorage.getItem(STORAGE_KEY);
  return saved ? JSON.parse(saved).startedAt : Date.now();
})();
const deadline = startedAt + DURATION_MS;

const SECTIONS = [
  { id: "secA", title: "SECTION A: IQ & COGNITIVE ABILITY", from: 1, to: 15 },
  { id: "secB", title: "SECTION B: APTITUDE & NUMERICAL REASONING", from: 16, to: 30 },
  { id: "secC", title: "SECTION C: ENGLISH & COMMUNICATION", from: 31, to: 45 },
  { id: "secD", title: "SECTION D: BUSINESS & WORKPLACE KNOWLEDGE", from: 46, to: 60 },
  { id: "secE", title: "SECTION E: ATTITUDE & SITUATIONAL JUDGMENT", from: 61, to: 75 }
];

const MCQ = [
  { id: 1, text: "Find the missing figure in the pattern: ▲ ■ ▲ ■ ▲ ___", options: ["▲", "■", "●", "◆"] },

  { id: 4, text: "A is older than B. B is older than C. Who is the youngest?", options: ["A", "B", "C", "Cannot be determined"] },
  { id: 5, text: "Which number comes next? 3, 9, 27, ___", options: ["54", "72", "81", "90"] },
  { id: 6, text: "If 12 machines produce 300 units in 5 hours, how many units will 6 machines produce in the same time?", options: ["75", "100", "150", "200"] },
  { id: 7, text: "Which word does NOT belong? Read – Write – Listen – Sleep", options: ["Read", "Write", "Listen", "Sleep"] },
  { id: 8, text: "Find the next number: 2, 6, 12, 20, ___", options: ["24", "26", "30", "32"] },
  { id: 9, text: "If ALL interns are learners and SOME learners are leaders, which statement is true?", options: ["All leaders are interns", "Some interns may be leaders", "No intern is a leader", "All learners are interns"] },
  { id: 10, text: "Which shape has the fewest sides?", options: ["Triangle", "Square", "Pentagon", "Hexagon"] },
  { id: 11, text: "Complete the analogy: Pen : Write :: Knife : ___", options: ["Cut", "Draw", "Hold", "Break"] },
  { id: 12, text: "Find the odd number: 12, 18, 24, 30, 35", options: ["12", "18", "30", "35"] },
  { id: 13, text: "If today is Monday, what day will it be after 23 days?", options: ["Tuesday", "Wednesday", "Thursday", "Friday"] },
  { id: 14, text: "Which number is the smallest?", options: ["0.75", "¾", "0.70", "7/10"] },
  { id: 15, text: "Which completes the series? A, C, F, J, ___", options: ["M", "N", "O", "P"] },
  { id: 16, text: "If 4 workers take 10 days to complete a task, how many days will 8 workers take?", options: ["2", "4", "5", "10"] },
  { id: 17, text: "25% of 200 is:", options: ["25", "40", "50", "75"] },
  { id: 18, text: "A product costs 1,000. After a 10% discount, the price is:", options: ["850", "900", "950", "1,100"] },
  { id: 19, text: "Which fraction is the largest?", options: ["1/4", "2/5", "3/8", "5/12"] },
  { id: 20, text: "If you buy 3 items at 120 each, what is the total cost?", options: ["240", "300", "360", "420"] },
  { id: 21, text: "If x + 5 = 12, x equals:", options: ["5", "6", "7", "8"] },
  { id: 22, text: "What is the average of 10, 20, and 30?", options: ["15", "20", "25", "30"] },
  { id: 23, text: "A train travels 60 km in 1 hour. How far will it travel in 3 hours?", options: ["120 km", "150 km", "180 km", "200 km"] },
  { id: 24, text: "If 1 USD = 300 LKR, how much is 5 USD?", options: ["1,200", "1,300", "1,500", "1,800"] },
  { id: 25, text: "Which number is even?", options: ["17", "21", "33", "40"] },
  { id: 26, text: "If you save 500 per month, how much will you save in 6 months?", options: ["2,000", "2,500", "3,000", "3,500"] },
  { id: 27, text: "Which percentage is highest?", options: ["0.6", "60%", "3/5", "All are equal"] },
  { id: 28, text: "What is 15% of 100?", options: ["10", "15", "20", "25"] },
  { id: 29, text: "If a task takes 2 hours, how long will 3 identical tasks take?", options: ["4 hours", "5 hours", "6 hours", "8 hours"] },
  { id: 30, text: "Which is NOT a number?", options: ["12", "0", "−3", "√"] },
  { id: 31, text: "Choose the most professional sentence:", options: ["I didn’t do it because it was hard", "I was busy, so I couldn’t finish", "The task was delayed due to unforeseen issues and will be completed shortly", "I forgot to do it"] },
  { id: 32, text: "Choose the correct sentence:", options: ["He don’t understand the task", "He doesn’t understand the task", "He didn’t understood the task", "He don’t understands"] },
  { id: 33, text: "The opposite of “confidential” is:", options: ["Private", "Secure", "Public", "Restricted"] },
  { id: 34, text: "Which word best fits? “Please ___ the report before submission.”", options: ["Look", "See", "Check", "Watch"] },
  { id: 35, text: "A professional email should be:", options: ["Emotional", "Casual", "Clear and polite", "Long and detailed"] },
  { id: 36, text: "Which is a polite request?", options: ["Send me the file now", "I want the file", "Please send the file at your convenience", "Why haven’t you sent it?"] },
  { id: 37, text: "Choose the correct spelling:", options: ["Responsibility", "Responsability", "Responsibilty", "Responsibilitty"] },
  { id: 38, text: "Which greeting is best for a formal email?", options: ["Hi buddy", "Hey", "Dear Sir/Madam", "Hello friend"] },
  { id: 39, text: "Which sentence shows accountability?", options: ["I was not told clearly", "The mistake happened", "I take responsibility and will correct it", "It was not my fault"] },
  { id: 40, text: "Choose the correct option: “She has ___ the report already.”", options: ["Submit", "Submitted", "Submitting", "Submits"] },
  { id: 41, text: "Which word means “working together”?", options: ["Conflict", "Teamwork", "Control", "Delay"] },
  { id: 42, text: "Which is inappropriate in a workplace email?", options: ["Clear subject", "Polite tone", "Emojis", "Proper closing"] },
  { id: 43, text: "Choose the correct sentence:", options: ["We was late", "We were late", "We is late", "We be late"] },
  { id: 44, text: "Which is the best closing?", options: ["Bye", "Cheers mate", "Regards", "See ya"] },
  { id: 45, text: "Which word means “on time”?", options: ["Delay", "Punctual", "Late", "Ignore"] },
  { id: 46, text: "The main purpose of teamwork is to:", options: ["Reduce effort", "Share responsibility", "Achieve common goals", "Avoid work"] },
  { id: 47, text: "What should an intern do if unsure about a task?", options: ["Guess", "Ignore", "Ask for clarification", "Delay"] },
  { id: 48, text: "Confidential information should be:", options: ["Shared with friends", "Posted online", "Protected", "Ignored"] },
  { id: 49, text: "Professional behavior includes:", options: ["Coming late", "Meeting deadlines", "Using phone during meetings", "Ignoring instructions"] },
  { id: 50, text: "Efficiency means:", options: ["Doing tasks slowly", "Doing the right tasks", "Doing tasks with minimum resources", "Avoiding work"] },
  { id: 51, text: "Which shows good work ethics?", options: ["Leaving early", "Blaming others", "Taking responsibility", "Avoiding feedback"] },
  { id: 52, text: "Who is responsible for learning during an internship?", options: ["Supervisor only", "HR only", "Intern", "Colleagues"] },
  { id: 53, text: "Workplace safety means:", options: ["Working fast", "Ignoring rules", "Following safety procedures", "Taking risks"] },
  { id: 54, text: "A deadline is:", options: ["A suggestion", "A target completion date", "Optional", "Flexible always"] },
  { id: 55, text: "Which behavior damages teamwork?", options: ["Cooperation", "Communication", "Conflict", "Support"] },
  { id: 56, text: "Feedback is given to:", options: ["Punish", "Improve performance", "Demotivate", "Control"] },
  { id: 57, text: "Which shows professionalism?", options: ["Arguing publicly", "Accepting feedback", "Ignoring instructions", "Being defensive"] },
  { id: 58, text: "An intern should report to:", options: ["Anyone", "Supervisor", "Friends", "No one"] },
  { id: 59, text: "Which is most important at work?", options: ["Talent only", "Attitude only", "Skills only", "Attitude and skills"] },
  { id: 60, text: "Which action builds trust?", options: ["Hiding mistakes", "Taking credit for others’ work", "Being honest", "Avoiding responsibility"] },
  { id: 61, text: "You are given a task outside your comfort zone. What do you do?", options: ["Refuse", "Delay", "Try to learn and attempt", "Complain"] },
  { id: 62, text: "A teammate is not contributing. What should you do FIRST?", options: ["Complain to management", "Ignore", "Speak politely to the teammate", "Do their work"] },
  { id: 63, text: "You make a mistake. What is the best response?", options: ["Hide it", "Blame others", "Inform supervisor and fix it", "Wait"] },
  { id: 64, text: "Your supervisor criticizes your work. You should:", options: ["Argue", "Ignore", "Listen and improve", "Feel demotivated"] },
  { id: 65, text: "You have multiple tasks with the same deadline. What do you do?", options: ["Panic", "Random order", "Prioritize", "Delay"] },
  { id: 66, text: "What shows a growth mindset?", options: ["Avoiding challenges", "Asking for feedback", "Blaming others", "Doing minimum work"] },
  { id: 67, text: "A colleague needs help and you are free. You should:", options: ["Ignore", "Help if possible", "Report", "Leave"] },
  { id: 68, text: "If instructions are unclear, you should:", options: ["Guess", "Ask for clarification", "Ignore", "Delay"] },
  { id: 69, text: "Which attitude is preferred at work?", options: ["Defensive", "Cooperative", "Lazy", "Negative"] },
  { id: 70, text: "When faced with pressure, you should:", options: ["Panic", "Give up", "Stay calm and prioritize", "Avoid work"] },
  { id: 71, text: "Which behavior shows ownership?", options: ["Blaming others", "Taking responsibility", "Avoiding tasks", "Complaining"] },
  { id: 72, text: "What should you do if you finish work early?", options: ["Leave", "Relax", "Ask for more work", "Use phone"] },
  { id: 73, text: "Ethical behavior means:", options: ["Doing what is easy", "Doing what is right", "Doing what benefits you", "Doing nothing"] },
  { id: 74, text: "What motivates good performance?", options: ["Fear", "Learning and growth", "Avoiding responsibility", "Competition only"] },
  { id: 75, text: "Which is a positive workplace habit?", options: ["Procrastination", "Punctuality", "Excuses", "Complaints"] }
];

const WRITING = [
  { id: 76, text: "Why do you want to join this internship program?" },
  { id: 77, text: "Describe a situation where you took responsibility." },
  { id: 78, text: "What do you expect to learn during this internship?" },
  { id: 79, text: "How do you handle feedback or criticism?" },
  { id: 80, text: "Where do you see yourself in 3–5 years?" }
];

/** 3. RENDERING **/
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function renderMCQ(q) {
  const div = document.createElement("div");
  div.className = "q";
  div.innerHTML = `
    <h4>Q${q.id}. ${escapeHtml(q.text)}</h4>
    <div class="options">
      ${q.options.map((opt, idx) => `
        <label class="opt">
          <input type="radio" name="mcq_${q.id}" value="${idx}" />
          <span>${escapeHtml(opt)}</span>
        </label>
      `).join("")}
    </div>
  `;
  return div;
}

function renderWriting(w) {
  const div = document.createElement("div");
  div.className = "q";
  div.innerHTML = `
    <h4>Q${w.id}. ${escapeHtml(w.text)}</h4>
    <textarea name="writing_${w.id}" placeholder="Write 4–6 lines..."></textarea>
  `;
  return div;
}

function renderAll() {
  const container = document.getElementById("form");
  container.innerHTML = "";
  for (const sec of SECTIONS) {
    const secDiv = document.createElement("div");
    secDiv.className = "section";
    secDiv.id = sec.id;
    secDiv.innerHTML = `<div class="section-head"><h3 class="section-title">${escapeHtml(sec.title)}</h3><div class="section-badge">Q${sec.from}–Q${sec.to}</div></div>`;
    for (let qid = sec.from; qid <= sec.to; qid++) {
      const q = MCQ.find(x => x.id === qid);
      if(q) secDiv.appendChild(renderMCQ(q));
    }
    container.appendChild(secDiv);
  }
  const writeDiv = document.createElement("div");
  writeDiv.className = "section";
  writeDiv.id = "secF";
  writeDiv.innerHTML = `<div class="section-head"><h3 class="section-title">SECTION F: SHORT WRITING</h3><div class="section-badge">Q76–Q80</div></div>`;
  for (const w of WRITING) writeDiv.appendChild(renderWriting(w));
  container.appendChild(writeDiv);
}

/** 4. LOGIC & SUBMISSION **/
function collectAnswers() {
  const mcqAnswers = [];
  for (let i = 1; i <= 75; i++) {
    const checked = document.querySelector(`input[name="mcq_${i}"]:checked`);
    mcqAnswers.push(checked ? Number(checked.value) : null);
  }
  const writingAnswers = [];
  for (let i = 76; i <= 80; i++) {
    const ta = document.querySelector(`textarea[name="writing_${i}"]`);
    writingAnswers.push(ta ? ta.value.trim() : "");
  }
  return { mcqAnswers, writingAnswers };
}

function computeAnswered() {
  let count = document.getElementById("name").value.trim() ? 1 : 0;
  for (let i = 1; i <= 75; i++) if (document.querySelector(`input[name="mcq_${i}"]:checked`)) count++;
  for (let i = 76; i <= 80; i++) {
    const ta = document.querySelector(`textarea[name="writing_${i}"]`);
    if (ta && ta.value.trim().length > 0) count++;
  }
  return count;
}

function updateProgress() {
  const total = 81;
  const answered = computeAnswered();
  const pct = Math.round((answered / total) * 100);
  document.getElementById("progressText").textContent = `Progress: ${answered}/${total} answered (${pct}%)`;
  document.getElementById("progressBar").style.width = pct + "%";
}

function saveState() {
  if (submitted) return;
  const name = document.getElementById("name").value.trim();
  const { mcqAnswers, writingAnswers } = collectAnswers();
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ name, mcqAnswers, writingAnswers, startedAt }));
  const el = document.getElementById("autosaveStatus");
  el.textContent = "Auto-saved.";
  setTimeout(() => { el.textContent = ""; }, 1000);
}

function restoreState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  const st = JSON.parse(raw);
  if (st.name) document.getElementById("name").value = st.name;
  if (st.mcqAnswers) {
    st.mcqAnswers.forEach((v, i) => {
      if (v !== null) {
        const input = document.querySelector(`input[name="mcq_${i+1}"][value="${v}"]`);
        if (input) input.checked = true;
      }
    });
  }
  if (st.writingAnswers) {
    st.writingAnswers.forEach((v, i) => {
      const ta = document.querySelector(`textarea[name="writing_${i+76}"]`);
      if (ta) ta.value = v;
    });
  }
}

function stopTimers() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  if (autosaveInterval) {
    clearInterval(autosaveInterval);
    autosaveInterval = null;
  }
}

function setAnswersDisabled(disabled) {
  document.querySelectorAll('input[type="radio"]').forEach(el => { el.disabled = disabled; });
  document.querySelectorAll('textarea').forEach(el => { el.disabled = disabled; });
}

async function submitTest(auto = false) {
  if (submitted) return;
  
  const name = document.getElementById("name").value.trim();
  if (!name) {
    alert("Please enter your full name.");
    return;
  }
  
  if (!auto && !confirm("Are you sure you want to submit?")) return;

  stopTimers();
  submitted = true;
  const status = document.getElementById("status");
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  status.textContent = "Submitting...";

  const { mcqAnswers, writingAnswers } = collectAnswers();
  const payload = { name, mcqAnswers, writingAnswers, startedAt, submittedAt: Date.now() };

  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      mode: "cors"
    });

    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch(e) { if(res.ok) json = {ok:true}; else throw e; }

    if (json.ok) {
      status.textContent = "Submitted successfully.";
      status.className = "ok";
      localStorage.removeItem(STORAGE_KEY);
      clearInterval(autosaveInterval);
      document.getElementById("form").innerHTML = "<div class='panel'><h2>Submission Successful</h2><p>Thank you for completing the assessment. You may now close this window.</p></div>";
    } else {
      throw new Error(json.error || "Submit failed");
    }
  } catch (e) {
    status.textContent = "Error: " + e.message;
    status.className = "warn";
    submitted = false;
    btn.disabled = false;
  }
}

/** 5. INITIALIZE **/
renderAll();
restoreState();
updateProgress();

timerInterval = setInterval(() => {
  const rem = deadline - Date.now();
  const el = document.getElementById("timer");
  if (rem <= 0) {
    if (!timeUp) {
      timeUp = true;
      el.textContent = "Time's up!";
      setAnswersDisabled(true);
      stopTimers();
      alert("Time is up. Please enter your full name and submit the test.");
    }
  } else {
    const sec = Math.floor(rem/1000);
    el.textContent = `Time left: ${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
  }
}, 1000);

autosaveInterval = setInterval(() => { saveState(); updateProgress(); }, 15000);
document.addEventListener("input", updateProgress);
document.addEventListener("change", updateProgress);
document.getElementById("submitBtn").addEventListener("click", () => submitTest(false));

</script>
